version: "2"
sql:
  - engine: "mysql"
    queries: "query.sql"
    schema: "schema.sql"
    gen:
      go:
        package: "queries"
        out: "queries"
        emit_json_tags: true
        json_tags_case_style: "snake"
        overrides:
          - db_type: "int"
            nullable: true
            go_type:
              type: "int32"
              pointer: true
          - db_type: "varchar"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
