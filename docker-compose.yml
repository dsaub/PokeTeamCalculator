services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-pokedata}
      MARIADB_USER: ${DB_USER:-pokedata}
      MARIADB_PASSWORD: ${DB_PASSWORD:-change-me}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Cola entre la API y el worker. Con AOF sobrevive a un reinicio; si aun así
  # pierde los datos, la API vuelve a encolar desde MariaDB.
  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrator:
    image: mariadb:11.4
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: "3306"
    volumes:
      - ./migraciones:/migraciones:ro
    command: ["sh", "/migraciones/aplicar.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me-redis}@redis:6379/0
      GIN_MODE: release
      # Confía en la red de Docker para leer X-Forwarded-For de nginx.
      PROXIES_CONFIABLES: ${PROXIES_CONFIABLES:-172.16.0.0/12}
    ports:
      - "8080:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    # El worker solo habla con Redis y no sirve HTTP. Sin env_file: así no
    # recibe las credenciales de MariaDB ni los secretos de la API.
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me-redis}@redis:6379/0
      HILOS: ${HILOS:-}
      TRABAJOS_SIMULTANEOS: ${TRABAJOS_SIMULTANEOS:-2}
      INTERVALO_LATIDO_MS: ${INTERVALO_LATIDO_MS:-5000}
      LATIDO_CADUCADO_MS: ${LATIDO_CADUCADO_MS:-60000}
      MAX_INTENTOS: ${MAX_INTENTOS:-3}
      TIMEOUT_TAREA_MS: ${TIMEOUT_TAREA_MS:-60000}
      ESPERA_APAGADO_MS: ${ESPERA_APAGADO_MS:-30000}
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  db_data:
  redis_data:
